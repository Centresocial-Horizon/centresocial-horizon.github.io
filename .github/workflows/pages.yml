name: Publier le site Horizon

"on":
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh the two-calendar-month visibility rule every day.
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Vérifier puis publier
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer les contenus du centre
        uses: actions/checkout@v4

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-editor.txt

      - name: Installer les outils de publication
        run: python -m pip install --disable-pip-version-check -r requirements-editor.txt

      - name: Vérifier les contenus et construire le site
        run: python scripts/build-editor.py --site-root .

      - name: Préparer uniquement les fichiers publics
        shell: python
        run: |
          from pathlib import Path
          import shutil
          source = Path.cwd()
          output = source / "_site"
          excluded = {".git", ".github", ".openai", ".venv", "venv", "node_modules",
                      "scripts", "tests", "publication", "migration", "__pycache__", "_site",
                      "README.md", "requirements-editor.txt"}
          if output.exists():
              shutil.rmtree(output)
          output.mkdir()
          def ignore(folder, names):
              return [name for name in names
                      if name in excluded or name.startswith(".env")]
          for item in source.iterdir():
              if item.name in excluded or item.name.startswith(".env"):
                  continue
              if item.is_symlink():
                  raise RuntimeError("Lien symbolique interdit dans la publication : " + item.name)
              if item.is_dir():
                  shutil.copytree(item, output / item.name, ignore=ignore)
              else:
                  shutil.copyfile(item, output / item.name)
          assert (output / "index.html").is_file(), "Page d’accueil absente"
          assert (output / "edition/.generated.json").is_file(), "Manifest de génération absent"

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer la version à mettre en ligne
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Mettre le site en ligne
        id: deployment
        uses: actions/deploy-pages@v4

      # A failed build must be visible to the editor even when the deploy action
      # has not run. The deploy action already reports successful deployments.
      - name: Signaler une publication échouée à l’éditeur
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const repository = { owner: context.repo.owner, repo: context.repo.repo };
            const result = await github.rest.repos.createDeployment({
              ...repository,
              ref: context.sha,
              environment: 'github-pages',
              auto_merge: false,
              required_contexts: [],
              description: 'La publication du site Horizon a échoué'
            });
            await github.rest.repos.createDeploymentStatus({
              ...repository,
              deployment_id: result.data.id,
              state: 'failure',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Ouvrir le journal pour connaître le problème'
            });
